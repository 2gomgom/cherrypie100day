/* =====================================================================
   🍓 CHERRY PIE BAKERY — UI DESIGN SYSTEM  (Strawberry Milk Bakery × Kawaii Dessert Game)
   모든 색·글꼴·테두리·모서리·그림자·간격·모션은 이 :root 블록 한 곳에서 관리합니다.
   · 레이어: ① 원시 팔레트(--c-*)  ② 의미 토큰(--c-primary, --line …)  ③ 구 변수 별칭(--pk, --ink …)

   ===================================================================== */
:root{
/* ① 팔레트 ─ 딸기우유 핑크(메인) */
--c-pink-50:#FFF3F3;--c-pink-100:#FDE6E9;--c-pink-200:#F9D2D9;--c-pink-300:#F2B6C2;--c-pink-400:#E8909F;--c-pink-500:#CF6A82;--c-pink-600:#B85A70;--c-pink-700:#8F4156;
/* ① 팔레트 ─ 생크림 화이트 */
--c-cream-50:#FFFCF9;--c-cream-100:#FFF8F1;--c-cream-200:#F8EDE3;--c-cream-300:#EBD9CC;
/* ① 팔레트 ─ 체리 레드 */
--c-cherry-200:#F59BAA;--c-cherry-400:#DC5068;--c-cherry-500:#C2334D;--c-cherry-700:#7E1F34;
/* ① 팔레트 ─ 버터 옐로 */
--c-butter-100:#FFF6D6;--c-butter-300:#FBE3A0;--c-butter-400:#F5CF73;--c-butter-500:#E3AE3F;--c-butter-600:#B98A2A;
/* ① 팔레트 ─ 잎사귀(성공/완료 포인트) · 코코아(글자/윤곽) · 바구니 */
--c-leaf:#7FA586;--c-leaf-soft:#BFD8C3;
--c-cocoa-900:#5A3E3A;--c-cocoa-600:#8A6B67;--c-stage:#3D2B30;
--c-basket-1:#E6BE82;--c-basket-2:#D4A563;--c-basket-edge:#9A6A3C;

/* ② 의미 토큰 ─ 색 */
--c-ink:var(--c-cocoa-900);--c-ink-soft:var(--c-cocoa-600);
--c-primary:var(--c-pink-500);--c-primary-strong:var(--c-pink-600);--c-primary-deep:var(--c-pink-700);
--c-accent:var(--c-cherry-500);--c-highlight:var(--c-butter-400);--c-success:var(--c-leaf);
--c-surface:var(--c-cream-100);--c-surface-raised:var(--c-cream-50);
--c-glass:rgba(255,249,245,.9);--c-on-primary:#FFFAF6;
--c-hover:rgba(207,106,130,.12);--c-focus:var(--c-butter-500);--c-track:rgba(143,65,86,.14);

--c-text-shadow:rgba(143,65,86,.45);--c-shadow:rgba(107,58,70,.34);
--grad-primary:linear-gradient(180deg,var(--c-pink-400),var(--c-pink-500));
--grad-primary-on:linear-gradient(180deg,var(--c-pink-600),var(--c-pink-700));
--grad-cherry:radial-gradient(circle at 35% 30%,var(--c-cherry-200),var(--c-cherry-500) 55%,var(--c-cherry-700));

/* ② 의미 토큰 ─ 글꼴 · 크기(em: #app 글자 크기에 비례해 PC/모바일 모두 자동 스케일) */
--f-title:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
--f-body:'Gowun Dodum','Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
--f-accent:Georgia,'Times New Roman',serif;
--fw-body:400;--fw-strong:400;
--fs-xs:.82em;--fs-sm:.9em;--fs-md:1em;--fs-lg:1.2em;--fs-xl:1.5em;--fs-2xl:2.4em;
--lh-tight:1.12;--lh-body:1.55;--ls-title:.02em;

/* ② 의미 토큰 ─ 테두리 · 모서리 */
--line:rgba(143,65,86,.2);--line-strong:rgba(143,65,86,.34);--bw:1px;--bw-bold:1.5px;
--r-xs:8px;--r-s:12px;--r-m:18px;--r-l:26px;--r-pill:999px;

/* ② 의미 토큰 ─ 그림자(핑크빛 코코아 그림자 · 단계별) */
--sh-1:inset 0 1px 0 rgba(255,255,255,.75),0 6px 18px -6px var(--c-shadow);
--sh-2:inset 0 1px 0 rgba(255,255,255,.8),0 16px 34px -10px rgba(107,58,70,.46);
--sh-float:0 4px 14px -4px rgba(107,58,70,.3);
--sh-frame:0 0 0 1px rgba(255,248,244,.18),0 0 0 7px #54393F,0 28px 70px rgba(30,12,18,.55);
--sh-btn:inset 0 1px 0 rgba(255,255,255,.34),0 4px 0 var(--c-pink-700),0 12px 20px -8px rgba(107,58,70,.55);
--sh-btn-press:inset 0 2px 4px rgba(94,34,52,.25),0 1px 0 var(--c-pink-700),0 4px 8px -4px rgba(107,58,70,.5);

/* ② 의미 토큰 ─ 간격(4px 기반) · 모션 */
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;
--ease-pop:cubic-bezier(.2,.9,.3,1.2);--dur-fast:.12s;--dur:.25s;--dur-slow:.5s;

/* ③ 구 변수 별칭(기존 CSS/JS 호환) */
--ink:var(--c-ink);--pk:var(--c-primary-strong);--pkd:var(--c-primary-deep);--cr:var(--c-cream-100);--paper:var(--c-surface);
--beige:var(--c-cream-300);--sage:var(--c-butter-400);--sage-d:var(--c-leaf);
box-sizing:border-box}

.chip{display:inline-block;background:var(--c-butter-400);color:var(--c-ink);border-radius:var(--r-pill);padding:2px 11px;font:var(--fw-strong) var(--fs-sm) var(--f-title);letter-spacing:.04em}

.tag{display:inline-block;background:var(--c-primary-strong);color:var(--c-on-primary);border-radius:var(--r-pill);padding:1px 14px;font:var(--fw-strong) var(--fs-xs)/1.5 var(--f-title)}
.panel{background:var(--c-surface);border:var(--bw) solid var(--line);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--sh-2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;font-family:var(--f-body);font-weight:var(--fw-body);color:var(--ink);background:var(--c-stage);overscroll-behavior:none;touch-action:none}

   · 단위는 em(창 크기에 비례). 모두 html[data-v=pc] 한정이라 모바일 레이아웃은 그대로 */
#pcL{display:none}

/* =====================================================================
   v60 · 패널/버튼 스타일 개선 (CSS 만 추가 — 마크업·이벤트 리스너·게임 로직은 그대로)
   · 주문서 = 레시피 카드 / 진행 목록 = 스티커 체크리스트 / 버튼 = 핑크(기본) + 체리 레드(주요 행동)
   · 장식은 주문서(체크무늬 띠·하트)와 이름표(하트)에만 사용
   ===================================================================== */
:root{
--c-gingham:rgba(194,51,77,.14);
--c-paper-edge:rgba(184,90,112,.38);
--sh-card:inset 0 1px 0 rgba(255,255,255,.9),0 1px 0 rgba(255,255,255,.6),0 10px 22px -10px rgba(107,58,70,.42),0 2px 5px -1px rgba(107,58,70,.16);
--sh-sticker:0 0 0 2.5px #fff,0 0 0 3.5px rgba(184,90,112,.26),0 4px 8px -3px rgba(107,58,70,.4);
}

/* ── 공통 패널: 더 부드러운 모서리 + 안쪽 하이라이트 + 섬세한 테두리 ── */
.glass{border:1.5px solid var(--c-paper-edge);border-radius:var(--r-l);box-shadow:var(--sh-card);background:linear-gradient(180deg,rgba(255,252,249,.95),rgba(255,244,242,.9))}
#top.glass{border-radius:var(--r-pill)}
#hint.glass{border-radius:var(--r-l)}
#ck{border:1.5px solid var(--c-paper-edge);box-shadow:var(--sh-card)}
#ov4{border-radius:var(--r-l)}

/* ── 버튼: 핑크(기본) · 체리 레드(주요 행동: 시작/다음/꺼내기/완료) ── */
.btn{--ledge:var(--c-pink-700);--top:#E8869C;--bot:#CF5F7A;
 color:var(--c-on-primary);text-shadow:0 1px 1px rgba(110,30,52,.5);
 background:linear-gradient(180deg,var(--top),var(--bot));
 border:1.5px solid rgba(126,31,52,.32);border-radius:var(--r-l);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(126,31,52,.12),0 4px 0 var(--ledge),0 12px 18px -8px rgba(107,58,70,.55);
 min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(94,34,52,.25),0 1px 0 var(--ledge),0 4px 8px -4px rgba(107,58,70,.5)}
.bot>.btn:not(.on):not(.sec):not(.gold),#out:not(.on),#ckdone:not(.on){--ledge:var(--c-cherry-700);--top:#E5667D;--bot:#C2334D}
.btn.sec{--ledge:var(--c-pink-300);color:var(--c-primary-deep);text-shadow:none;background:linear-gradient(180deg,#fff,var(--c-pink-100));border:1.5px solid var(--c-paper-edge)}
.btn.gold{--ledge:var(--c-butter-600);border:1.5px solid rgba(185,138,42,.4)}
.btn.on,.btn[aria-pressed="true"]{background:linear-gradient(180deg,var(--c-pink-600),var(--c-pink-700));box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 4px 0 var(--c-pink-700),0 0 0 3px var(--c-butter-400)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;filter:grayscale(.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 var(--ledge)}
#ckundo{--ledge:var(--c-pink-700)}

/* ── 대화창: 이중 테두리(크림 안쪽선) + 하트 이름표 ── */
.dlg{background:linear-gradient(180deg,#FFFDFB,#FFF5F3);border:1.5px solid var(--c-paper-edge);border-radius:var(--r-l);
 box-shadow:inset 0 0 0 4px #FFFDFB,inset 0 0 0 5px rgba(184,90,112,.2),0 14px 28px -12px rgba(107,58,70,.5),0 2px 5px -1px rgba(107,58,70,.16)}
.nm{background:linear-gradient(180deg,#D9708A,var(--pk));border:1.5px solid #fff;box-shadow:0 4px 10px -3px rgba(107,58,70,.5);padding:1px 14px 1px 11px}
.nm:before{content:"♥";font-size:.8em;margin-right:5px;opacity:.9}

/* ── 주문서 = 레시피 카드 (모바일 .tk / PC 왼쪽 첫 패널) ── */
.tk,html[data-v=pc] .pcc:first-child{position:relative;overflow:hidden;
 background:linear-gradient(180deg,#FFFEFC,#FFF7F0);
 border:1.5px solid var(--c-paper-edge);border-left-width:1.5px;border-radius:var(--r-m);
 box-shadow:var(--sh-card),inset 0 0 0 4px #FFFEFC,inset 0 0 0 5px rgba(184,90,112,.16)}
.tk{padding:22px 18px 13px;transform:rotate(-.4deg);line-height:1.7}
.tk:before,html[data-v=pc] .pcc:first-child:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;
 background:conic-gradient(var(--c-gingham) 25%,transparent 0 50%,var(--c-gingham) 0 75%,transparent 0) 0 0/9px 9px;
 border-bottom:1px solid rgba(194,51,77,.18)}
.tk:after,html[data-v=pc] .pcc:first-child:after{content:"♥";position:absolute;right:11px;top:15px;width:1.7em;height:1.7em;display:grid;place-items:center;
 font-size:.82em;line-height:1;color:var(--c-cherry-500);background:#fff;border:1.5px solid rgba(194,51,77,.3);border-radius:50%;
 box-shadow:0 2px 4px -1px rgba(107,58,70,.3);transform:rotate(8deg)}
.tk::first-line{font-family:var(--f-title);color:var(--pkd);font-size:1.12em}
html[data-v=pc] .pcc:first-child{padding:1.4em 1em .9em}
html[data-v=pc] .pcc:first-child h3{color:var(--pkd);font-size:1.1em;padding-bottom:.4em;margin-bottom:.5em;border-bottom:1.5px dashed var(--c-paper-edge);padding-right:1.8em}
html[data-v=pc] .pcc:first-child p{font-size:.88em;line-height:1.6}
html[data-v=pc] .pcc:first-child p:before{content:"· ";color:var(--c-cherry-400)}

/* ── 진행 목록 = 스티커 체크리스트 (PC 왼쪽 둘째 패널) ── */
.pcc:nth-child(2){padding:.8em .8em .9em}
.pcc:nth-child(2) h3{padding-left:.2em}
.pcc ol{gap:.5em}
.pcc li{position:relative;gap:.6em;padding:.38em .8em .38em .45em;border-radius:var(--r-pill);opacity:1;
 background:#FFFDFB;color:var(--c-cocoa-600);border:1px solid rgba(184,90,112,.22);
 box-shadow:0 0 0 2px #fff,0 3px 6px -3px rgba(107,58,70,.35);transform:rotate(-.7deg)}
.pcc li:nth-child(even){transform:rotate(.7deg)}
.pcc li:before{content:"";flex:none;width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:50%;
 background:#fff;border:1.5px dashed var(--c-pink-300);color:transparent;font-size:.85em;line-height:1;text-align:center}
.pcc li.done{background:#F2FAF3;color:var(--c-cocoa-900);border-color:rgba(127,165,134,.55)}
.pcc li.done:before{content:"✔";background:var(--c-leaf);border:1.5px solid #fff;color:#fff;box-shadow:0 1px 3px rgba(60,90,66,.4)}
.pcc li.on{background:linear-gradient(180deg,#E8869C,#CF5F7A);color:var(--c-on-primary);border-color:rgba(126,31,52,.3);
 box-shadow:0 0 0 2.5px #fff,0 0 0 3.5px rgba(184,90,112,.3),0 5px 9px -3px rgba(107,58,70,.5);transform:rotate(0)}
.pcc li.on:before{content:"▶";background:#fff;border:1.5px solid #fff;color:var(--c-cherry-500);font-size:.7em;padding-left:.12em}

/* ── 진행 점(모바일 상단) · 영수증 · 안내 말풍선 정리 ── */
#chip{background:linear-gradient(180deg,var(--c-butter-300),var(--c-butter-400));border:1.5px solid #fff;box-shadow:0 2px 5px -2px rgba(107,58,70,.4)}
#dots i{height:.55em;border:1px solid rgba(184,90,112,.2)}
#dots i.on{background:linear-gradient(180deg,#E5667D,var(--c-cherry-500));border-color:#fff}
.rc{border-radius:var(--r-m);border:1.5px solid var(--c-paper-edge);background:linear-gradient(180deg,#FFFEFC,#FFF7F0);box-shadow:var(--sh-card),inset 0 0 0 4px #FFFEFC,inset 0 0 0 5px rgba(184,90,112,.16)}
.toast{border:1.5px solid var(--c-paper-edge);box-shadow:inset 0 0 0 4px #FFFDFB,inset 0 0 0 5px rgba(184,90,112,.2),var(--sh-2)}

/* =====================================================================
   v61 · UI 디테일 통일 (CSS 만 추가 — 게임 로직·3D·스토리·점수 판정·마크업은 변경 없음)
   ① 글꼴 크기·굵기 규칙  ② 간격 규칙  ③ 아이콘 배지 규칙  ④ 진행도 표시
   ⑤ 버튼 상태(기본·호버·눌림·비활성·선택·포커스)  ⑥ 짧은 모션(투명도/이동만, 조작 방해 없음)
   ※ JS 가 위치·회전을 직접 바꾸는 #nd #mk #ck #gz #zn 에는 애니메이션을 걸지 않습니다.
   ===================================================================== */
:root{
/* ① 글자 규칙: 제목/라벨/버튼 = Jua(굵기 400 한 가지) · 본문 = Gowun Dodum 400 */
--t-label:.84em;--t-body:.98em;--t-btn:1.1em;--t-head:1.12em;
--lh-ui:1.5;
/* ③ 아이콘 배지 공통 */
--ic-border:1.5px solid #fff;--ic-shadow:0 1px 3px rgba(107,58,70,.35);
/* ⑥ 모션 */
--ease-out:cubic-bezier(.22,.8,.3,1);--dur-quick:.14s;--dur-soft:.22s;
}
@keyframes uiFade{from{opacity:0}to{opacity:1}}
@keyframes uiRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes uiStick{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes uiPop{0%{transform:scale(.6)}65%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ① 글꼴 크기·굵기 */
body{line-height:var(--lh-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.btn,#vt button,.nm,.tag,.chip,#chip,.pcc h3,#cbk .bl,#zn{font-weight:400}
.btn{font-size:var(--t-btn);line-height:1.2;letter-spacing:.03em}
#ckundo,#ckdone{font-size:1em}
.dlg,.tk,#hint{font-size:var(--t-body);line-height:1.55}
.dlg .tx{line-height:1.6}
.nm,.pcc li{font-size:var(--t-label)}
.pcc li{font-size:.9em}
.pcc h3{font-size:var(--t-head);line-height:1.25}
.pcc p{font-size:.9em;line-height:1.6}
#ttl{font-size:var(--t-head)}
#chip{font-size:var(--t-label);line-height:1.5}

/* ② 간격: 4px 단위(--sp-*) */
.bot{gap:var(--sp-3)}
@media (max-height:680px){.bot{gap:var(--sp-2)}}
.dlg{padding:20px var(--sp-4) var(--sp-3)}
#top{gap:var(--sp-3);padding:var(--sp-2) var(--sp-4)}
#hint{gap:var(--sp-3)}
#ov4{gap:var(--sp-4)}
.pcc{padding:var(--sp-3) var(--sp-4)}
.pcc ol{gap:var(--sp-2)}
html[data-v=pc] #pcL{gap:var(--sp-3)}

/* ③ 아이콘 배지: 모양·테두리·그림자를 한 가지로 통일 */
#hint:before,.pcc li:before,.nm:before{border:var(--ic-border);box-shadow:var(--ic-shadow)}
.nm:before{border:0;box-shadow:none}
#hint:before{width:2.2em;height:2.2em;font-size:1.2em;line-height:1}
.lg,#ring b,#hint:before{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',var(--f-body)}
#ck{gap:var(--sp-2)}
#ck button{width:38px;height:38px;transition:background-color var(--dur-quick),transform var(--dur-quick) var(--ease-out)}
html[data-v=pc] #ck button{width:2.6em;height:2.6em}
#ck button i{transition:background-color var(--dur-quick)}
@media (hover:hover){#ck button:not(.on):hover{background:var(--c-hover)}}
#ck button:active{transform:scale(.92)}

/* ④ 진행도 표시: 상단 칩·점, PC 단계 스티커, 굽기/게이지 트랙 */
#dots{gap:var(--sp-1);align-items:center}
#dots i{width:1.2em;height:.55em;border-radius:var(--r-pill);transition:width var(--dur-soft) var(--ease-out),background-color var(--dur-soft)}
#dots i.on{width:1.9em}
.pcc li{transition:background-color var(--dur-soft),color var(--dur-soft),box-shadow var(--dur-soft),transform var(--dur-soft) var(--ease-out)}
.pcc li.on{animation:uiStick .3s var(--ease-out)}
.pcc li.done:before{animation:uiPop .3s var(--ease-out)}
.lb i{transition:width .2s linear}
#cbk .bv{letter-spacing:.01em}

/* ⑤ 버튼 상태 통일 ─ 기본 → 호버(살짝 뜸) → 눌림(내려앉음) → 비활성 → 선택 → 포커스 */
.btn,#vt button{transition:transform var(--dur-quick) var(--ease-out),box-shadow var(--dur-quick) var(--ease-out),filter var(--dur-quick),background-color var(--dur-quick),color var(--dur-quick)}
@media (hover:hover){
 .btn:not(:disabled):not([aria-disabled="true"]):not(.on):hover{transform:translateY(-1px);filter:brightness(1.05) saturate(1.04)}
 #vt button:not(.on):hover{background:var(--c-hover)}
}
.btn:not(:disabled):not([aria-disabled="true"]):not(.on):active{transform:translateY(3px) scale(.985);filter:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;filter:grayscale(.3);cursor:not-allowed;transform:none;text-shadow:none}
.btn.on,.btn[aria-pressed="true"]{transform:none}
.btn:focus-visible,#ck button:focus-visible,#vt button:focus-visible{outline:3px solid var(--c-focus);outline-offset:3px}
#vt button{font-size:1em;line-height:1.4}

/* ⑥ 짧은 모션: 새로 나타나는 패널만 0.2~0.3초 페이드(이동은 6px). 게임 입력·판정과 무관 */
#hint:not(.hide){animation:uiRise var(--dur-soft) var(--ease-out) backwards}
html[data-v=pc] #pcL .pcc{animation:uiRise .28s var(--ease-out) backwards}
html[data-v=pc] #pcL .pcc:nth-child(2){animation-delay:.05s}
.tk,.rc{animation:uiFade .25s ease-out backwards}
@media (prefers-reduced-motion:reduce){.pcc li.on,.pcc li.done:before,#hint,.pcc,.tk,.rc{animation:none!important}}

/* 미완료 단계의 점선 원은 유지 */
.pcc li:not(.done):not(.on):before{border:1.5px dashed var(--c-pink-300);box-shadow:none}
/* ===== v62 CUTE PATCH : 스티커 같은 하얀 테두리 · 동글동글 · 하트/꽃 장식 ===== */
@keyframes cpTw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.28) rotate(18deg)}}
@keyframes cpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.glass{border:2.5px solid #fff;border-radius:22px;box-shadow:0 0 0 2px var(--c-pink-300),0 7px 0 -1px rgba(207,106,130,.2),0 12px 22px -8px var(--c-shadow);background:linear-gradient(180deg,rgba(255,252,250,.95),rgba(253,230,233,.9))}
#top{border-radius:var(--r-pill);padding:8px 18px}
#ttl:before{content:"♡ ";color:var(--c-pink-400)}#ttl:after{content:" ♡";color:var(--c-pink-400)}
#dots{gap:5px}#dots i{width:.66em;height:.66em;border-radius:50%}
#dots i.on{background:var(--grad-cherry);box-shadow:0 0 0 2px var(--c-pink-200)}
#chip{background:linear-gradient(180deg,var(--c-butter-300),var(--c-butter-400));border:1.5px solid #fff;box-shadow:0 2px 0 var(--c-butter-600)}
#hint{border-radius:28px;padding:10px 20px 10px 10px}
#hint:before{animation:cpBob 2.2s ease-in-out infinite;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--c-pink-300),inset 0 -2px 4px rgba(143,65,86,.12)}
#hint:after{content:"✿";position:absolute;right:14px;top:-11px;font-size:1.35em;color:var(--c-pink-400);text-shadow:0 1px 0 #fff;animation:cpTw 2.4s ease-in-out infinite}
.btn{border-radius:var(--r-pill);border:2.5px solid #fff;padding:11px 34px;letter-spacing:.05em}
.btn:not(:disabled):after{content:" ♡";font-size:.85em;opacity:.9}
#ckundo:after,#ckdone:after,#out:after{content:""}
#gz{border:2.5px solid #fff;box-shadow:0 0 0 2px var(--c-pink-300),inset 0 2px 4px rgba(90,62,58,.18),0 8px 16px -8px rgba(107,58,70,.5)}
#zn{border-radius:10px}
#mk{top:50%;bottom:auto;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--grad-cherry);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--c-cherry-700),0 2px 6px rgba(107,58,70,.55)}
#ring{box-shadow:0 0 0 5px #fff,0 0 0 8px var(--c-pink-300),0 12px 20px -8px rgba(107,58,70,.55)}
#nd{background:var(--c-cherry-500);width:5px;border-radius:5px}
#ck{border:2.5px solid #fff;box-shadow:0 0 0 2px var(--c-pink-300),var(--sh-float)}
#cbk .bv{text-shadow:0 2px 0 #fff}
/* ===== PC 프레임 레이아웃 (PC 모드 전용) =====
   · 게임 화면은 브라우저 창과 같은 가로세로 비율을 그대로 유지한 채, 사방에 여백을 두고 같은 비율로 축소(최대 크기 제한).
   · 크기(--aw/--ah)·글자 기준(--afs)은 vApply() 가 창 크기에 맞춰 계산 → 3D 캔버스·UI 가 같은 비율로 같이 줄고 늘어남
   · 바깥 여백: 핑크·크림 깅엄 체크 + 프레임 이중 테두리 + 소량의 장식 (게임 화면·조작 UI 위에는 겹치지 않음) */
html[data-v=pc],html[data-v=pc] body{background:#F4E7DA}
#pcbg{display:none;position:fixed;left:0;top:0;z-index:0;image-rendering:pixelated;pointer-events:none}
html[data-v=pc] #pcbg{display:block}   /* 도트 베이커리 매장 배경 */
html[data-v=pc]:not([data-fr="p"]) #app{position:fixed;inset:0;margin:auto;width:var(--aw,100vw);height:var(--ah,100dvh);font-size:var(--afs,13px);border-radius:18px;z-index:1;
 box-shadow:0 0 0 4px #3D2B30,0 0 0 9px #F6B1C1,0 0 0 13px #3D2B30,0 0 0 15px #FFF8F1,0 26px 50px 8px rgba(60,20,30,.6)}
html[data-v=pc][data-fr="p"] #app{border-radius:18px;z-index:1;box-shadow:0 0 0 4px #3D2B30,0 0 0 9px #F6B1C1,0 0 0 13px #3D2B30,0 0 0 15px #FFF8F1,0 26px 50px 8px rgba(60,20,30,.6)}
html[data-v=pc] #vt{top:6px}
/* 코너 장식 없음(도트 배경만 사용) */
/* ===== v63 PC 5:4 UI 재배치 (PC 전용) · 화면 = 54em × 67.5em 기준 =====
   상단 중앙: 단계 캡슐 / 모서리 상단: 주문서(접기 가능)·안내 말풍선 / 하단: 게이지·버튼·도구 / 중앙: 3D 플레이 영역은 비워 둠 */
html[data-v=pc] #pcL{left:1em;top:1em;width:11.5em;max-height:calc(100% - 2em)}
html[data-v=pc] #pcL .pcc:first-child{pointer-events:auto;padding:1.2em .9em .8em}
html[data-v=pc] #pcL .pcc:first-child h3{cursor:pointer;font-size:1em}
html[data-v=pc] #pcL .pcc:first-child h3:after{content:" ▾";font-size:.8em;color:var(--c-pink-400)}
html[data-v=pc] #pcL .pcc.fold h3{margin-bottom:0;border-bottom:0;padding-bottom:0}
html[data-v=pc] #pcL .pcc.fold h3:after{content:" ▸"}
html[data-v=pc] #pcL .pcc.fold p{display:none}
html[data-v=pc] #pcL .pcc:first-child p{font-size:.8em;line-height:1.5}
html[data-v=pc] #hint{top:1em;right:1em;width:12.5em;padding:.7em .9em;font-size:.95em}
html[data-v=pc] #top{max-width:calc(100% - 27em)}
html[data-v=pc] #gz{width:min(30em,calc(100% - 30em));bottom:4.6em}
html[data-v=pc] #ov4{width:11.5em}
html[data-v=pc] #ck{width:12.5em;padding:2.1em .6em .7em}
html[data-v=pc] #ring{width:6em;height:6em}
html[data-v=pc] #ring b{font-size:1.6em}
html[data-v=pc] .ov{padding:3.3em 12.8em 1.2em}
html[data-v=pc] .bot:not(.rcb){max-width:42em}
html[data-v=pc] .bot:not(.rcb)>.dlg{flex:1 1 24em}
html[data-v=pc] #scBan{font-size:.95em}
html[data-v=pc] #ckundo,html[data-v=pc] #ckdone{min-height:2.6em;padding:.3em 1.3em;font-size:1em;min-width:8em}
html[data-v=pc] #out{min-height:2.6em;padding:.3em 1.3em}

/* ===== v68 오프닝(시작 화면) 리디자인: 눈이 편한 크림 + 진한 체리 글자, 체크/이모지 제거 ===== */
#ld .ldbg{background:radial-gradient(ellipse at 50% 38%,#FFF8F0,#F6E2D5 78%)}
#ld .ldck2{background:#E3A9B0;color:#E3A9B0}
#ld .ldck{color:#FFF6EC;background:radial-gradient(circle,rgba(207,106,130,.17) 1.6px,transparent 2.3px) 0 0/20px 20px,linear-gradient(180deg,#FFF8F0,#F9E8DC)}
#ld .ldck:before{filter:drop-shadow(0 3px 0 rgba(143,65,86,.12))}
#ld .ldt{gap:1em}
#ld .ldic{display:block;width:clamp(44px,9vw,68px);margin:0 auto .45em;image-rendering:pixelated;animation:ldpop .45s cubic-bezier(.3,1.6,.5,1) .5s both,bob 2.2s ease-in-out 1s infinite}
#ld .ldh{color:#A12844;letter-spacing:.02em;text-shadow:0 2px 0 #FFF8F0,0 4px 0 #F2B6C2,0 5px 0 #E8909F,0 14px 18px rgba(143,65,86,.2)}
#ld .dc{opacity:0;filter:none;font-size:inherit;line-height:0}
#ld .dc{font-size:16px}
#ld .dc svg{display:block;width:var(--w,1.5em);height:var(--w,1.5em);image-rendering:pixelated}
#ld .lds{display:inline-flex;align-items:center;gap:.8em;padding:.4em 1.3em .4em 1.5em;border-radius:99px;background:#5A3E3A;color:#FFF1E3;text-shadow:none;letter-spacing:.24em;box-shadow:0 4px 0 #3D2B30,0 10px 16px -6px rgba(90,62,58,.45)}
#ld .lds:before,#ld .lds:after{content:"";width:.45em;height:.45em;background:#F5CF73;flex:none}
#ld .ldm p{color:#7A5048;font-size:1em}
#ld .lb{height:16px;border:2px solid #7A5048;background:#F3DCCD;box-shadow:inset 0 2px 0 rgba(122,80,72,.15)}
#ld .lb i{background:repeating-linear-gradient(90deg,#CF6A82 0 9px,#E8909F 9px 11px,transparent 11px 12px)}

/* ===== v69 오프닝 2차: 레이어드 커튼(어닝 트림 + 가렌드 + 체리 자수) · 두 줄 로고 타이틀 ===== */
